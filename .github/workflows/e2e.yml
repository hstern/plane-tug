name: e2e

# End-to-end test: spins up a real Plane CE instance, builds the
# plane-tug image, and drives an issue change through the
# webhook → SSE round-trip. Roughly four minutes on a cold cache;
# runs on every push and pull request because the regressions it
# catches (Plane payload shape, HMAC roundtrip, SSRF allowlist,
# compose-network DNS) are not visible in unit or in-process
# integration tests.
#
# workflow_dispatch stays available for manual reruns.

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  e2e:
    name: docker-compose e2e
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version: "1.26.x"
          check-latest: true

      - name: docker compose version
        run: docker compose version

      - name: bring up Plane CE + plane-tug + seed
        run: bash test/e2e-docker/run.sh up

      - name: run e2e tests
        run: go test -tags e2e -count=1 -v ./test/e2e-docker/...

      - name: dump plane-api logs on failure
        if: failure()
        run: |
          docker compose -f test/e2e-docker/compose.yaml logs --tail=200 plane-api
          docker compose -f test/e2e-docker/compose.yaml logs --tail=200 plane-worker
          docker compose -f test/e2e-docker/compose.yaml logs --tail=200 plane-tug

      - name: tear down
        if: always()
        run: bash test/e2e-docker/run.sh down
