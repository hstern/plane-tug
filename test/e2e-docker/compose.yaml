# Compose stack for the plane-tug e2e test.
#
# Mirrors a minimal Plane CE v1.3.1 deployment with the bridge alongside.
# No frontends (web/space/admin/live); the test program drives Plane via
# its REST API and the bridge via HTTP directly.
#
# `fake-plane` is a tiny container that returns 200 on any path. It
# stands in for Plane's /api/users/me/ so test clients can hold a
# hand-crafted session cookie; the real session-cookie pass-through is
# already covered by the planeauth unit tests.

x-db-env: &db-env
  PGHOST: plane-db
  PGDATABASE: plane
  POSTGRES_USER: plane
  POSTGRES_PASSWORD: plane
  POSTGRES_DB: plane
  POSTGRES_PORT: "5432"
  PGDATA: /var/lib/postgresql/data

x-redis-env: &redis-env
  REDIS_HOST: plane-redis
  REDIS_PORT: "6379"
  REDIS_URL: redis://plane-redis:6379/

x-minio-env: &minio-env
  MINIO_ROOT_USER: access-key
  MINIO_ROOT_PASSWORD: secret-key

x-aws-s3-env: &aws-s3-env
  AWS_REGION: ""
  AWS_ACCESS_KEY_ID: access-key
  AWS_SECRET_ACCESS_KEY: secret-key
  AWS_S3_ENDPOINT_URL: http://plane-minio:9000
  AWS_S3_BUCKET_NAME: uploads

x-mq-env: &mq-env
  RABBITMQ_HOST: plane-mq
  RABBITMQ_PORT: "5672"
  RABBITMQ_DEFAULT_USER: plane
  RABBITMQ_DEFAULT_PASS: plane
  RABBITMQ_DEFAULT_VHOST: plane
  RABBITMQ_VHOST: plane

x-app-env: &app-env
  # Plane's anti-SSRF webhook validator DNS-resolves and rejects private
  # IPs. plane-tug is reachable on this compose network as
  # http://plane-tug:8080; WEBHOOK_ALLOWED_HOSTS bypasses the check.
  WEBHOOK_ALLOWED_HOSTS: plane-tug,host.docker.internal
  WEBHOOK_ALLOWED_IPS: ""
  WEB_URL: http://localhost:8765
  DEBUG: "0"
  CORS_ALLOWED_ORIGINS: http://localhost:8765
  GUNICORN_WORKERS: "1"
  USE_MINIO: "1"
  DATABASE_URL: postgresql://plane:plane@plane-db/plane
  SECRET_KEY: ci-secret-key-not-for-production-use-32chr
  AMQP_URL: amqp://plane:plane@plane-mq:5672/plane
  API_KEY_RATE_LIMIT: 600/minute
  MINIO_ENDPOINT_SSL: "0"
  LIVE_SERVER_SECRET_KEY: ci-live-secret-not-for-production-use32

services:
  plane-db:
    image: postgres:15.7-alpine
    command: postgres -c 'max_connections=1000'
    environment:
      <<: *db-env
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U plane -d plane"]
      interval: 5s
      timeout: 3s
      retries: 20

  plane-redis:
    image: valkey/valkey:7.2.11-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  plane-mq:
    image: rabbitmq:3.13.6-management-alpine
    user: "100:101"
    environment:
      <<: *mq-env
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "check_port_connectivity"]
      interval: 10s
      timeout: 5s
      retries: 20

  plane-minio:
    image: minio/minio:RELEASE.2025-01-20T14-49-07Z
    command: server /export --console-address ":9090"
    environment:
      <<: *minio-env
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 3s
      retries: 20

  plane-migrator:
    image: makeplane/plane-backend:v1.3.1
    command: ./bin/docker-entrypoint-migrator.sh
    environment:
      <<: [*app-env, *db-env, *redis-env, *minio-env, *aws-s3-env]
    depends_on:
      plane-db:
        condition: service_healthy
      plane-redis:
        condition: service_healthy
    restart: on-failure

  plane-api:
    image: makeplane/plane-backend:v1.3.1
    command: ./bin/docker-entrypoint-api.sh
    environment:
      <<: [*app-env, *db-env, *redis-env, *minio-env, *aws-s3-env]
    depends_on:
      plane-migrator:
        condition: service_completed_successfully
      plane-db:
        condition: service_healthy
      plane-redis:
        condition: service_healthy
      plane-mq:
        condition: service_healthy
      plane-minio:
        condition: service_healthy
    ports:
      - "8765:8000"
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:8000/api/instances/"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 60s

  plane-worker:
    image: makeplane/plane-backend:v1.3.1
    command: ./bin/docker-entrypoint-worker.sh
    environment:
      <<: [*app-env, *db-env, *redis-env, *minio-env, *aws-s3-env, *mq-env]
    depends_on:
      plane-api:
        condition: service_healthy
      plane-mq:
        condition: service_healthy

  plane-beat-worker:
    image: makeplane/plane-backend:v1.3.1
    command: ./bin/docker-entrypoint-beat.sh
    environment:
      <<: [*app-env, *db-env, *redis-env, *minio-env, *aws-s3-env, *mq-env]
    depends_on:
      plane-api:
        condition: service_healthy
      plane-mq:
        condition: service_healthy

  # Tiny always-200 service standing in for Plane's /api/users/me/.
  # whoami responds 200 on any path and writes its request as the body,
  # which the bridge ignores — only the status code matters here.
  fake-plane:
    image: traefik/whoami:v1.10
    command: ["--port", "80"]

  # The bridge under test. By default builds from this checkout via the
  # multi-stage Dockerfile (local development). CI overrides
  # PLANE_TUG_IMAGE to a ghcr.io ref pushed by the build-image job so the
  # bytes the e2e job tests are the bytes publish will retag.
  plane-tug:
    image: ${PLANE_TUG_IMAGE:-ghcr.io/hstern/plane-tug:local}
    build:
      context: ../..
      dockerfile: Dockerfile
      tags:
        - ghcr.io/hstern/plane-tug:local
    environment:
      PLANE_TUG_WEBHOOK_SECRET: e2e-known-secret-not-random
      PLANE_TUG_PLANE_BASE_URL: http://fake-plane:80
      PLANE_TUG_LISTEN: ":8080"
      PLANE_TUG_LOG_LEVEL: debug
    ports:
      - "8081:8080"
    depends_on:
      fake-plane:
        condition: service_started

networks:
  default:
    name: plane-tug-e2e
